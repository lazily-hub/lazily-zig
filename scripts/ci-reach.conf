# CI-reachability configuration (#lzcheckcireachguard), read by check-ci-reach.sh.
#
# workflow:  a workflow whose run: steps count as CI reach. Listing one here is a
#            claim that it runs on every push/PR — a tag-triggered release
#            workflow must not be listed, because reaching a gate only when you
#            cut a release is not reaching it.
#
#            THAT CLAIM IS NOW CHECKED (#verifyworkflowactually). It used to live
#            only in this comment, and it is the premise every other mechanism in
#            this guard rests on: with `on:` reduced to `workflow_dispatch`, every
#            gate below still read as reached and the verdict was byte-identical to
#            healthy at exit 0. check-ci-reach.sh pins the workflow's exact `on:`
#            keys and their exact `branches:`/`paths:` filters, the exact set of
#            jobs that carry a gate, and per job the exact `if:`, `needs:`,
#            `continue-on-error:` and matrix legs — as literal VALUES in both
#            directions, not as forbidden absences, because this repo's advisory
#            master leg makes a job-level `continue-on-error` legitimately present.
#
#            What it still cannot see, said plainly: GitHub's branch protection. A
#            leg that gates here gates the WORKFLOW's conclusion; whether a red
#            workflow blocks a merge is a repository setting no file in this tree
#            can read.
# excuse:    a `make check` target that CI deliberately does not run, and why.
#
# The excuse list is the point of this file. It is the one place a reader can see
# what this binding does not enforce in CI, in the same spirit as KNOWN_UNCOVERED.
# Excuses are verified in both directions, so this list cannot rot into things
# that used to be true: an excuse for a target CI turns out to reach is a hard
# failure, and so is an excuse for a target `make check` does not run at all
# (#pinreachclosure). That second direction used to be a silent no-op — the
# excuse was simply ignored, the verdict still said `0 excused`, and the file read
# as though somebody had considered coverage that nothing here exempts.

workflow: .github/workflows/ci.yml

# No excuses. Every gate `make check` runs is reached by the CI workflow above,
# which is a claim the guard re-proves on every run rather than a note.
#
# Reach is per-STEP since #reversereachdirection: each gate is pinned to the CI
# step that runs it (EXPECTED_STEP_FOR_TARGET in check-ci-reach.sh) and its
# command is looked for inside that step, not in the union of every `run:` body.
# `fmt` is the exception and is named as one: CI runs it as `make fmt`, so it has
# no independent CI-side spelling to cross-check and gets no step pin.
#
# Reach here is per-command, not per-toolchain: this repo pins three zig
# toolchains and the workflow's test job is a matrix over all three, so `test`,
# `test-interop-peer` and `conformance-coverage` are in fact each run three
# times. The guard cannot see that and does not claim it — it proves the command
# is run somewhere, and the matrix is what makes it run everywhere it should.
# `test-lean-formal` runs once, in its own job, which is all `make check` does.
