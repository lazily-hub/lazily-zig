name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Zig build + test, across the toolchains this repo claims to support.
  #
  # 0.16.0 and `master` (nightly, currently 0.17.0-dev) are both gates.
  #
  # `master` was previously non-gating on the reasoning that a main branch red
  # from an upstream commit nobody here made is a branch people learn to ignore.
  # That reasoning cuts the other way now: development happens ON nightly, so
  # nightly is the toolchain most likely to be exercised and least likely to be
  # noticed when it rots. It is gating because the alternative in practice was
  # nightly-only code reaching main and breaking the 0.16.0 gate instead —
  # `Type.Fn.param_types` (nightly) vs `Type.Fn.params` (0.16.0) did exactly
  # that. Version-sensitive reflection belongs behind a `@hasField` shim so one
  # tree satisfies both; see `normalizeCompute` in src/lazily/context.zig.
  #
  # 0.15.2 is gating again (#lzzig0152). It had been non-gating because the tree
  # did not compile there at all, and a job that cannot fail is indistinguishable
  # from a job that passes — the same shape as a suite reporting green while
  # testing nothing. All four faults are fixed: the graph lock is one reentrant
  # lock on every toolchain (the split had left 0.15 with a NON-reentrant mutex
  # the engine cannot use), plus a `build.zig` env-field rename, a comptime
  # dependency loop from a field naming a container decl, and a nested error
  # union 0.15.2 will not coerce. `std.Io` genuinely does not exist there, so
  # `FileOutboxStore`'s two tests skip visibly; nothing else is downgraded.
  test:
    name: Zig ${{ matrix.zig }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        zig: ['0.15.2', '0.16.0', 'master']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Zig ${{ matrix.zig }}
        uses: mlugg/setup-zig@v2
        with:
          version: ${{ matrix.zig }}

      # The formatting gate (#lazilydartzig). Deliberately INSIDE the matrix
      # rather than in a job of its own: `zig fmt` is the formatter for whichever
      # toolchain runs it, and a gate that disagreed between 0.15.2, 0.16.0 and
      # master would be a coin flip depending on which one CI happened to use.
      # Running it on all three is what proves they agree, continuously, instead
      # of a comment claiming they do.
      - name: Format gate (make fmt)
        run: make fmt

      # lazily-spec is the canonical cross-language source for the conformance
      # fixtures. Clone it as a sibling BEFORE the test step so the replay
      # tests read the canonical files rather than skipping (#lzspecconf).
      - name: Fetch canonical lazily-spec conformance fixtures (#lzspecconf)
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-spec.git ../lazily-spec

      # Each replay test skips loudly when its fixture directory is absent,
      # which is right for a local checkout and wrong for CI: a skip that
      # nobody asserts against reports green while testing nothing. Assert
      # every directory that currently has a consumer in src/.
      #
      # This list must track the `SPEC_DIR` constants in src/lazily/*.zig.
      #
      # `reactive-graph` is back on the list: src/lazily/reactive_graph_conformance.zig
      # replays that corpus against every context this binding ships (Context /
      # ThreadSafeContext / AsyncContext). Its skip-when-absent branch is right
      # for a local checkout and wrong here, so the directory is asserted
      # present — and the runner itself asserts a non-zero count of fixtures,
      # ops and assertions actually replayed, so a green run cannot mean
      # "executed nothing" (#lzspecconf).
      - name: Assert conformance fixtures are present
        run: |
          set -euo pipefail
          for d in collections coordination distributed materialization membership \
                   presence rateshape reactive-graph resilience service signaling \
                   temporal windowing; do
            dir="../lazily-spec/conformance/$d"
            test -d "$dir" || {
              echo "::error::$dir missing — its replay test would skip and CI would report green having tested nothing"
              exit 1
            }
            ls "$dir"/*.json >/dev/null 2>&1 || {
              echo "::error::no *.json fixtures under $dir"
              exit 1
            }
          done

      # The recorder is a no-op unless LAZILY_CONFORMANCE_MANIFEST is set, so a
      # bare `zig build test` collects no evidence and the coverage guard below
      # could never run here. Until now it only ran under a local `make check`,
      # which meant the KNOWN_UNCOVERED ledger was enforced by whoever
      # remembered to run it — the same "enforced on one developer machine" gap
      # the benchmark budgets have.
      #
      # `-Dconformance-manifest` is passed as well as the env var, matching what
      # `make test` runs. The build option and the env var are the same knob —
      # build.zig falls back to LAZILY_CONFORMANCE_MANIFEST when the option is
      # absent — but running the command CI runs and the command `make check`
      # runs as two different spellings is how the two drift apart.
      - name: Test
        run: |
          mkdir -p build && : > build/conformance-fixtures-loaded.txt
          LAZILY_CONFORMANCE_MANIFEST="$PWD/build/conformance-fixtures-loaded.txt" \
            zig build test --summary all \
            -Dconformance-manifest="$PWD/build/conformance-fixtures-loaded.txt"

      # Cross-binding wire compatibility, run by `make check` and by no binding's
      # CI until now (#lzinteroppeerci). Runs on every toolchain in the matrix on
      # purpose: the wire layout is exactly the kind of thing a compiler version
      # can shift underneath you, so proving it on one toolchain proves it for
      # one toolchain.
      - name: Interop peer self-check (#lzinteroppeerci)
        run: zig build interop-peer-check

      # A fixture that lands upstream and is replayed by nobody here must fail
      # the build, not wait to be noticed. Runs on every toolchain in the matrix
      # because the manifest is per-run evidence, not a cached artifact.
      - name: Conformance coverage guard
        run: |
          LAZILY_CONFORMANCE_MANIFEST="$PWD/build/conformance-fixtures-loaded.txt" \
            ./scripts/check-conformance-coverage.sh

  # ---------------------------------------------------------------------------
  # `make check` also runs the Lean model in lazily-formal. It is split out
  # rather than folded into the matrix above: a Lean toolchain download and
  # `lake build` are slow and are their own failure surface, and gating fast
  # zig feedback behind them buys nothing.
  lean-formal:
    name: Lean formal model
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch lazily-formal sibling
        run: git clone --depth 1 https://github.com/lazily-hub/lazily-formal.git ../lazily-formal

      - name: Assert lazily-formal is present
        run: |
          test -f ../lazily-formal/lakefile.lean || {
            echo "::error::../lazily-formal/lakefile.lean missing — the formal-model gate would silently do nothing"
            exit 1
          }

      # Toolchain only. `build: false` on purpose: the gate is the explicit
      # `lake build` below, which is the command `make test-lean-formal` runs.
      # Letting the action build instead left CI with no run: step naming the
      # gate at all, so the CI-reachability guard could not see it and neither
      # could a reader diffing this file against the Makefile.
      - name: Install Lean toolchain
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: ../lazily-formal
          build: false
          test: false
          lint: false

      # The formal-model gate itself (#lzcheckcireachguard), spelled exactly as
      # `make test-lean-formal` spells it.
      - name: Build the formal model
        run: cd ../lazily-formal && lake build

  # ---------------------------------------------------------------------------
  # The gate that keeps every job above honest (#lzcheckcireachguard). It
  # compares `make check`'s prerequisite closure against the run: bodies in this
  # file and fails on any target CI does not reach. Comments inside run: bodies
  # are stripped first — a naive grep for "make check" reported all nine
  # bindings as covered and every one of those hits was a comment.
  #
  # Its own job because it needs neither a Zig nor a Lean toolchain: it reads
  # recipes through `make -n`, which expands variables without running anything.
  # Running it inside the Zig matrix would only run the same file comparison
  # three times.
  ci-reach:
    name: CI-reachability guard
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: CI-reachability guard (#lzcheckcireachguard)
        run: |
          out=$(./scripts/check-ci-reach.sh 2>&1) || { echo "$out"; echo "::error::a make check gate is unreachable from CI"; exit 1; }
          echo "$out"
          echo "$out" | grep -q "check-ci-reach: OK" || {
            echo "::error::the CI-reachability guard exited 0 without reaching its verdict"
            exit 1
          }
